<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar Variations</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        margin:0;
        padding:20px;
        background-color: #aa8565;
        color: rgb(0, 3, 1);
      }  
      .nav-container{
       margin-bottom: 40px;
      }
      h2{
        margin-bottom:10px;
      }
      .nav1 {
        background-color: #e5e8eb;
        padding: 10px;
      }
      .nav1 ul{
        list-style-type :none;
        margin:0;
        padding:0;
        display: flex;
        justify-content: space-around;
      }
      .nav1 li{
        display: inline;
      }
      .nav1 a{
        text-decoration: none;
        color:#060101;
        /* background-color: #c97a34; */
        padding: 5px 15px;
        border-radius: 5px; 
        position:relative;       
      }
      .nav1 a::after{
        content:"";
        position:absolute;
        height:2px;
        bottom:0;
        left:0;
        width:100%;
        background-color:#0a65c7;
        transform: scaleX(0);
        transition: transform 0.3s ease-in-out;
      }
      .nav1 a:hover::after{
       transform: scalex(1);
      }
      .nav1 .login-btn{
        background-color: #0c51d0;
        color:white;
        border: none;
        padding: 5px 15px;
        border-radius: 5px;
        cursor:pointer;
      }
        .nav1 .login-btn:hover{
            background-color: #043060;
            box-shadow: #043060 0px 4px 8px;
        }
        .nav2{
            background-color: #fff;
            width: 200px;
            padding: 10px;
        }
        .nav2 ul{
            list-style-type: none;
            margin: 0;
            padding:0px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav2 li{
            display:block;
           
        }
        .nav2 a{           
            text-decoration: none;
            color: #060101;
            display: block;
            padding: 5px 15px;
            width :80%;
            /*border-radius:5px;*/          
        }
        .nav2 a:hover{
            background-color: #5d82f2;
            
           
        }
        .nav2 .login-btn{
            background-color: #0c51d0;
            color:white;
            border: none;
            padding: 5px 15px;
            /* border-radius: 5px; */
            width: 90%;
            border: #030a62 solid 2px;
            cursor:pointer;
        }
        .nav2 .login-btn:hover{
            background-color: #043060;
            box-shadow: #043060 0px 4px 8px;
        }
        .nav3{
            background-color: #fff;
            padding: 10px;
        }
        .nav3 ul{
            list-style-type:none;
            margin:0;
            padding:0;
            display: flex;
            justify-content: space-around;
        }
        .nav3 li{
            display: inline;
        }
        .nav3 a{
            text-decoration: none;
            color: #060101;
            padding: 5px 15px;
            border-radius: 5px;
            position:relative;
        }
        .nav3 a::after{
            content:"";
            position:absolute;
            height:2px; 
            bottom:0;
            left:0;
            width:100%;
            background-color: #0a65c7;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }
        .nav3 a:hover::after{
            transform: scaleX(1);
        }
        .nav3 .login-btn{
            background-color: #0c51d0;
            color:white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor:pointer;
        }
        .nav3 .login-btn:hover{
            background-color: #043060;
            box-shadow: #043060 0px 4px 8px;
        }
        .nav3 div{
            position:relative;
        }
        .nav3 div a{
            display: block;
        }
        .nav3 div a::after{
            content:"";
            position:absolute;
            height:2px; 
            bottom:0;
            left:0;
            width:100%;
            background-color: #0a65c7;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }
        .nav3 div a:hover::after{
            transform: scaleX(1);
        }
        .nav3 div:hover .submenu{
            display:block;
        }
        .nav3 .submenu{
            display:none;
            position:absolute;
            top:100%;
            left:0;
            background-color:#fff;
            padding:10px;
            border-radius:5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .nav3 .submenu a{
            padding:5px 10px;
            white-space: nowrap;
        }
        .nav3 .submenu a::after{
            content:"";
            position:absolute;
            height:2px; 
            bottom:0;
            left:0;
            width:100%;
            background-color: #0a65c7;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }
        .nav3 .submenu a:hover::after{
            transform: scaleX(1);
        }
        
        
    </style>
</head>
<body>
    <div class="nav-container">
        <h2> Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>               
            </ul>
        </nav>
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class ="nav2">
            
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li> 
                <li><button class="login-btn">Login</button></li>                 
            </ul>
        </nav>
        <h2>Variation 3: Horizontal with dropdown submenu</h2>
            <nav class="nav3"> 
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <div>
                        <a href="#">Our story team contact</a>
                    </div>                   
                    <li><a href="#">Products</a></li>
                    <li><button class="login-btn">Login</button></li>
                </ul>
                </nav>
                    
                    
            </nav>
            </div>

    
</body>
</html>
