<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>

    body{
        font-family: Arial, Helvetica, sans-serif;
        margin:0;
        padding:20px;
        background-color: #c9c8c6;
        color:#000000;
    }
    .nav3{
        background-color: #040144;
        padding: 20px;
        border-radius: 5px;
    }
    .nav3 ul{
        list-style-type: none; 
        margin:0;
        padding:0;
        top: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    .nav3 li{
        display: inline;      
    }
    .nav3 a{
        text-decoration: none;
        color: #eeeaea;
        padding: 10px;
        display: block;
        border-radius: 5px;
    }
    .nav3 .dropdown {
        position: relative;

    }
    .nav3 .submenu {
        display: none;
        position: absolute;
        top: 110%;
        left: 0;
        background-color: #4d51c9;
        padding: 0;
        border-radius: 1px;
        min-width: 150px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .nav3 .submenu a {
        display: block;
        padding: 10px;
        color: #eeeaea;
    }
    .nav3 .dropdown:hover .submenu {
        display: block;
        
    }
    .nav3 a:hover {
        background-color: #5173d8;
    }
    .nav3 .submenu a:hover {
        background-color: #3742bf;
    }
    .nav3 .login-btn{
        background-color: #115dc2;
        color:white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px; 
        cursor:pointer;
    }
    .nav3 .login-btn:hover{
        background-color: #6770d9;
        box-shadow: #5b63d9 0px 4px 8px;
    }

</style>
</head>
<body>
    <div class="nav-container">
     
            <nav class="nav3"> 
                <ul>
                    <li><a href="#">Home</a></li>
                    <li class="dropdown"><a href="#">About</a>
                       <div class="submenu">
                            <a href="#">Our story</a>
                            <a href="#">Team</a>
                            <a href="#">Contact</a>
                        </div> 
                    </li>
                                  
                    <li><a href="#">Products</a></li>
                    <li><button class="login-btn">Login</button></li>
                </ul>
            </nav>
    </div>
</body>
</html>
