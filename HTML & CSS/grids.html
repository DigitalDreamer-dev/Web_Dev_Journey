<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid mastery</title>
    <style>
        body{
            background-color: #6c6c66;
            color: aliceblue;
        }
        .item{
            background-color: #edb753;
            padding:20px;
            border:1px solid black;
        }
        h1{
            white-space:nowrap;
        }
         .grid-container{ 
         display: grid;
          grid-template-columns: 100px 100px 100px; 
          grid-template-rows: 100px 100px;
          /* grid-column: 1/4; */
          /* gap: 2px; */

        } 
        .grid-container2{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows:100px 100px 100px;
        }
        .grid-container3{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows:100px 100px 100px; ;
        }
        .item1{
            background-color: #edb753;
            border:1px solid black;           
        }
        .grid-container4{
            display: grid;
            grid-template-columns: 100px 100px 100px;
            grid-template-rows:100px 100px; 
        }
        .grid-container5{
            display: grid;
            grid-template-columns: 100px 100px;
            grid-template-rows:100px 100px 100px; 
        }
        .item1 img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
    </style>
</head>
<body>
    <h1>Grid pattern 1</h1>
    <div class ="grid-container">
        <div class="item" style="grid-column: 1/4;">1</div>
        <div class="item" style="grid-column: 1/2; grid-row: 2/4;">2</div>
        <div class="item" style="grid-column: 2/4; grid-row: 2/4;">3</div>
        <div class="item"  style="grid-column: 1/4;">4</div>

    <h1>Grid pattern2 </h1>
    </div>
      <div class ="grid-container2">
        <div class="item1" style=" grid-column: 1/3; grid-row: 1/3;">1</div>
        <div class="item1">2</div>
        <div class="item1">3</div>
        <div class="item1" >4</div>
         <div class="item1">5</div>
         <div class="item1">6</div>
    </div>

     <h1>Grid pattern 3</h1>
    </div>
     <div class ="grid-container3">
        <div class="item1"style="grid-column:1/3;"><img src="photo1.jpeg" ></div>
        <div class="item1" style="grid-column:3/4; grid-row:1/3;"><img src="WhatsApp Image 2026-05-31 at 2.19.24 AM.jpeg"></div>
        <div class="item1" style="grid-row:2/4;"><img src="WhatsApp Image 2026-05-31 at 2.17.47 AM.jpeg"></div>
        <!-- <div class="item1" >4</div> -->
         <div class="item1" style="grid-column:2/4;"><img src="landscape.jpeg" ></div>        
    </div>
    <h1>Grid pattern 4</h1>
    </div>
     <div class ="grid-container4">
        <div class="item1">1</div>
        <div class="item1">2</div>
        <div class="item1">3</div>
        <div class="item1">4</div>
        <div class="item1">5</div>
        <div class="item1">6</div>
    </div>
    <h1>Grid pattern 4</h1>
    </div>
     <div class ="grid-container2">
        <div class="item1" style="grid-column:1/3">1</div>
        <div class="item1">2</div>
        <div class="item1" style="grid-column:1/2">3</div>
        <div class="item1">4</div>
        <div class="item1" style="grid-column:1/2">5</div>
    </div>
    <h1>Grid pattern 5</h1>
    </div>
     <div class ="grid-container5">
        <div class="item1" style="grid-column:1/3">1</div>
        <div class="item1" style="grid-column:1/2">2</div>
        <div class="item1" style="grid-column:2/3">3</div>
        <div class="item1" style="grid-column:1/2">4</div>
        <div class="item1" style="grid-column:2/3">5</div>
    </div>
    <h1>Grid pattern 6</h1>
    </div>
     <div class ="grid-container2">
        <div class="item1" style="grid-row:1/3">1</div>
        <div class="item1" style="grid-column:2/4">2</div>
        <div class="item1">3</div>
        <div class="item1">4</div>
        <div class="item1"style="grid-column:1/4">5</div>
       
    </div>
    
</body>
</html>
