<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: bisque;
            margin: 0;
            padding: 0;
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color:rgb(220, 189, 147);
            border-radius: 8px;
            padding:30px;
            width:300px;
        }
        h2{
            color:rgb(145, 92, 27);
            text-align: center;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
            gap:15px;
        }
        input{
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            background-color:#f2eeee;
        }
        button{
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            /* cursor: pointer; */
        }
        button:hover{
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type ="email" name="" id="" placeholder="Email">
            <input type ="password" name="" id="" placeholder="Password">
                <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
