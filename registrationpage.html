<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     body{
        background-color: #4070F4;
        
     } 
     .Main_div{
        background-color: #fff;
        display: grid;
        grid-template-columns: auto;
        grid-template-rows: auto;
              
    }  
    </style>
</head>
<body>
  <div class="Main_div">
        <h1>Registration</h1>
    <div>
         <h3>Personal Details</h3>
          <div>
            <label for="name">Full Name </label>
            <input type="text" id="name">
          </div>

        <div> 
            <label for="DOB">Date of Birth </label>
            <input type="text" id="DOB">
        </div>

        <div>
            <label for="Email">Email</label>
            <input type="email" id="Email">
        </div>

        <div>
            <label for="Phone_number">Phone number</label>
            <input type="number" id="Phone_number">
        </div>

        <div>
            <label for="Gender">Gender</label>
            <input type="text" id="Gender">
        </div>

        <div>
            <label for="Occupation">Occupation</label>
            <input type="text" id="Occupation">
        </div>
    </div>

       
    <div> 
        <h3>Identity Details</h3>

        <div>
            <label for="ID_Type">ID Type</label>
            <input type="number" id="ID_Type">
        </div>

        <div>
            <label for="ID_Number">ID Number</label>
            <input type="ID_Number" id="ID_Number">
        </div>

        <div>
            <label for="IA">Issue Authority</label>
            <input type="Text" id="IA">
        </div>

        <div>
            <label for="ID">Issue Date</label>
            <input type="Text" id="ID">
        </div>

        <div>
            <label for="IS">Issue State</label>
            <input type="text" id="IS">
        </div>

        <div>
            <label for="ED">Expiary Date</label>
            <input type="Text" id="ED">
        </div>
    </div>
        
        <button>Next</button>
    
    </div>
    
</body>
</html>
